name: Publish Lake Norman HVAC

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap5/GO'

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and unpack website
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/site.b64
          while IFS= read -r f; do
            cat "bootstrap5/$f" >> /tmp/site.b64
          done < bootstrap5/.verify-order
          base64 --decode /tmp/site.b64 > /tmp/site.zip
          echo "4d7765c439559107fe6c67ba5add4bbf6885b1c238e58528a83b1cd5c568ce90  /tmp/site.zip" | sha256sum -c -
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/site.zip -d /tmp/site
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/site/ ./
          rm -rf bootstrap bootstrap4 bootstrap5
          rm -f site-bootstrap.b64
          rm -f .github/workflows/bootstrap-site.yml
          rm -f .github/workflows/bootstrap-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Lake Norman HVAC website"
          git push

      - name: Enable GitHub Pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"source":{"branch":"main","path":"/"}}')
          if [ "$code" = "201" ] || [ "$code" = "409" ] || [ "$code" = "422" ]; then
            cat /tmp/pages.json || true
          else
            cat /tmp/pages.json || true
            exit 1
          fi
