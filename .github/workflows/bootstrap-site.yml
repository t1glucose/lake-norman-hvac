name: Bootstrap website

on:
  push:
    branches: [main]
    paths:
      - site-bootstrap.b64
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack website and publish files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode site-bootstrap.b64 > /tmp/site.zip
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/site.zip -d /tmp/site
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/site/ ./
          rm -f site-bootstrap.b64
          rm -f .github/workflows/bootstrap-site.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Lake Norman HVAC website"
          git push
